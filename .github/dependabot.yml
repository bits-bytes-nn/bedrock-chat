version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    groups:
      backend:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /cdk
    schedule:
      interval: monthly
    groups:
      cdk:
        update-types: [minor, patch]
