name: Add 'needs triage' label

on:
  issues:
    types:
      - opened

permissions:
  issues: write

jobs:
  add-label:
    # Upstream maintenance only; forks have no Pages site or triage process.
    if: github.repository == 'aws-samples/bedrock-chat'
    runs-on: ubuntu-latest

    steps:
      - name: Add 'needs triage' label
        uses: actions-ecosystem/action-add-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: "needs-triage"
