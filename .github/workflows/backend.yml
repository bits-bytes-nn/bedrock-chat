name: Backend tests

on:
  pull_request:
    branches:
      - v3
    paths:
      - "backend/**"
      # tests/test_model_registry.py checks the frontend model list.
      - "frontend/src/constants/index.ts"
      - "frontend/src/hooks/useModel.ts"
      - "frontend/src/i18n/en/index.ts"
      # tests/test_usecases/test_file_conversion.py checks the convertible files.
      - "frontend/src/constants/supportedAttachedFiles.ts"
      # tests/test_alarm_log_terms.py checks the log lines that alarms count.
      - "cdk/lib/constructs/monitoring.ts"
      - "cdk/lib/api-publishment-stack.ts"
      - ".github/workflows/backend.yml"
  push:
    branches:
      - v3
    paths:
      - "backend/**"
      # tests/test_model_registry.py checks the frontend model list.
      - "frontend/src/constants/index.ts"
      - "frontend/src/hooks/useModel.ts"
      - "frontend/src/i18n/en/index.ts"
      # tests/test_usecases/test_file_conversion.py checks the convertible files.
      - "frontend/src/constants/supportedAttachedFiles.ts"
      # tests/test_alarm_log_terms.py checks the log lines that alarms count.
      - "cdk/lib/constructs/monitoring.ts"
      - "cdk/lib/api-publishment-stack.ts"
      - ".github/workflows/backend.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Unit tests must not reach AWS. Tests marked `aws` are excluded by default.
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Install Poetry
        # Same version as the poetry.lock header.
        run: pipx install poetry==2.2.1
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: poetry
          cache-dependency-path: backend/poetry.lock
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run black
        run: poetry run black --check .
      - name: Run mypy
        run: poetry run mypy --config-file mypy.ini .
      - name: Run unit tests
        run: poetry run pytest
      - name: Check that the API starts
        run: |
          poetry run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/health

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build backend/Dockerfile
        run: docker build -t backend .
      - name: Build backend/lambda.Dockerfile
        run: docker build -f lambda.Dockerfile -t backend-lambda .
