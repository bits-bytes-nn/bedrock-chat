name: CDK tests

on:
  # Pull requests run this from ci.yml, whose ci-ok job is the required check.
  workflow_call: {}
  push:
    branches:
      - v3
    paths:
      - "cdk/**"
      - "backend/**"
      - "!backend/tests/**"
      - "frontend/**"
      - ".github/workflows/cdk.yml"
      - ".github/scripts/retry-on-ecr-rate-limit.sh"
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: cdk

jobs:
  synth-and-test:
    runs-on: ubuntu-latest
    # The tests and synth retry ECR Public rate limits, waiting up to 3 minutes.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: cdk/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        # Jest checks only the files that the tests import, not the bin entry points.
        run: npx tsc --noEmit -p .
      # Both bundle Lambda code in images from ECR Public.
      - name: Run unit tests
        run: ../.github/scripts/retry-on-ecr-rate-limit.sh npm test
      - name: Synthesize
        run: ../.github/scripts/retry-on-ecr-rate-limit.sh npx cdk synth --quiet
