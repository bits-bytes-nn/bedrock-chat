name: CDK tests

on:
  pull_request:
    branches:
      - v3
    paths:
      - "cdk/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/cdk.yml"
  push:
    branches:
      - v3
    paths:
      - "cdk/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/cdk.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: cdk

jobs:
  synth-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: cdk/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Synthesize
        run: npx cdk synth --quiet
